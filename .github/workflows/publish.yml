name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        env:
          # Classic token auth. To switch to OIDC trusted publishing:
          # configure a "GitHub Actions" trusted publisher for this package
          # on npmjs.com, then delete this env line.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}`
          # into .npmrc — correct with a real token. Without one, it exports a
          # dummy placeholder that makes npm skip OIDC and fail with E404, so
          # strip the line and let npm fall back to OIDC trusted publishing.
          if [ -z "$NODE_AUTH_TOKEN" ]; then sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"; fi
          npm publish --access public --provenance
