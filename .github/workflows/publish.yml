name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish to npm
        env:
          # NPM_TOKEN secret is invalid (E404 on PUT). Empty string clears
          # setup-node's dummy placeholder AND skips token auth entirely,
          # forcing npm's OIDC trusted-publisher exchange. Requires a
          # "GitHub Actions" trusted publisher configured on npmjs.com.
          # Fallback: rotate NPM_TOKEN on npmjs.com and set this env back to
          # ${{ secrets.NPM_TOKEN }}.
          NODE_AUTH_TOKEN: ""
        run: |
          # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}`
          # into .npmrc. With an empty token it still writes the line (empty
          # auth), so strip it — npm then sees no configured auth and uses the
          # GitHub OIDC id-token for trusted publishing instead.
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          npm publish --access public --provenance
